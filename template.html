<!doctype html>
<html lang="en">
<head>

<title>AI CEO · Bennett's Command Center (public)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--panel:#ffffff;--ink:#16181d;--mute:#6b6f78;--line:#dcd8cf;--green:#1f8a4c;--yellow:#b7860b;--red:#c2362b;--gray:#9aa0a8;--blue:#2d5bd7;--accent:#c2362b;--chip:#efece5;--sans:"IBM Plex Sans Condensed",-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--panel:#171a1f;--ink:#e9e7e2;--mute:#8d929b;--line:#2a2e35;--chip:#21252b;--green:#3fbf74;--yellow:#e0b23a;--red:#ef5b4f;--gray:#6f757e;--blue:#6d93ff;--accent:#ef5b4f}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
header{max-width:1180px;margin:0 auto;padding:22px 18px 8px}.kicker{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:6px 0 4px}.sub{color:var(--mute);font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tabs a{flex:none;padding:12px 12px 10px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.bar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pill{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}.pill.on{background:var(--ink);color:var(--bg)}
.fresh{margin-left:auto;font:12px var(--mono);color:var(--mute)}main{max-width:1180px;margin:0 auto;padding:4px 18px 40px}section{display:none}section.on{display:block}h2{font-size:22px;margin:18px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi b{display:block;font:600 30px/1 var(--mono)}.kpi span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:10px;padding:12px 14px}.card.g{border-left-color:var(--green)}.card.y{border-left-color:var(--yellow)}.card.r{border-left-color:var(--red)}
.card h3{margin:0 0 2px;font-size:17px}.meta{font:12px var(--mono);color:var(--mute)}.doing{margin-top:6px;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:12px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font:600 11px var(--mono);text-transform:uppercase;color:var(--mute)}
.prog{height:8px;background:var(--chip);border-radius:4px;min-width:90px;overflow:hidden}.prog i{display:block;height:100%}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.empty{color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}.warn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}a.ext{color:var(--blue)}.mono{font-family:var(--mono)}
</style>
</head>
<body>
<header><div class="kicker">AI CEO</div><h1>Bennett's command center</h1><div class="sub">Snapshots from Notion · refresh requested every 10 minutes. Completion requires verified output.</div></header>
<nav><div class="tabs" id="tabs"></div></nav>
<div class="bar"><div id="companies" style="display:flex;gap:6px;flex-wrap:wrap"></div><span class="fresh" id="fresh"></span></div>
<main><div id="pagewarn"></div><section id="now"></section><section id="coceo"></section><section id="agents"></section><section id="devices"></section><section id="projects"></section><section id="tasks"></section><section id="caio"></section><section id="crons"></section></main>
<script>
__REPORT_STATUS__
const TABS=[["now","Now"],["coceo","Co-CEOs"],["agents","Agents"],["devices","Devices"],["projects","Projects"],["tasks","All tasks"],["caio","CAIO"],["crons","CRONs"]];
const COMPANIES=["All companies","Franchise KI","Advaita AI","Grokbot","Personal"];
const S={data:{},tab:"now",co:"All companies"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pid=u=>{const m=String(u||"").replace(/-/g,"").match(/[0-9a-f]{32}/i);return m?m[0].toLowerCase():""};
const rel=v=>{if(!v)return[];try{const a=typeof v==="string"?JSON.parse(v):v;return(Array.isArray(a)?a:[a]).map(pid).filter(Boolean)}catch{return[]}};
const ago=t=>{if(!t)return"unknown";const parsed=ReportStatus.time(t);if(parsed==null||parsed>Date.now())return"invalid/future timestamp";const m=Math.floor((Date.now()-parsed)/60000);return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":Math.floor(m/1440)+"d ago"};
const byId=l=>{const m={};(l||[]).forEach(r=>m[pid(r.url)]=r);return m};
function tabsUI(){tabs.innerHTML=TABS.map(([k,l])=>`<a href="#${k}" data-k="${k}" class="${S.tab===k?"on":""}">${l}</a>`).join("");companies.innerHTML=COMPANIES.map(c=>`<button class="pill ${S.co===c?"on":""}" data-co="${esc(c)}">${esc(c)}</button>`).join("");document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===S.tab))}
tabs.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();S.tab=a.dataset.k;history.replaceState(null,"","#"+S.tab);render()});
companies.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.co=b.dataset.co;render()});
const savedCompany=new URL(location.href).searchParams.get("company");if(COMPANIES.includes(savedCompany))S.co=savedCompany;
const h0=location.hash.slice(1);if(TABS.some(t=>t[0]===h0))S.tab=h0;
function live(id){return ReportStatus.evaluate(S.data.report_coverage?.per_agent?.[id],SNAP_AT)}
function reportMeta(L){
 const r=L.last,stamp=(t)=>esc(t||"Unknown");
 return `<div class="meta">Process: ${esc(L.process)}</div><div class="meta">Logged (server): ${stamp(r?.Logged)}${r?.Logged?" · "+esc(ago(r.Logged)):""} · ${esc(L.receipt)}</div><div class="meta">Time (worker): ${stamp(r?.Time)} · ${esc(L.worker)}</div><div class="meta">Coverage: ${L.coverage?.exhaustive?"exhaustive source query":"not included / unverified"} · ${L.coverage?.matching_rows??"unknown"} matching rows · ${L.coverage?.invalid_receipt_rows||0} quarantined invalid receipts${L.coverage?.latest_invalid_receipt?" · latest invalid Logged: "+stamp(L.coverage.latest_invalid_receipt.Logged):""}${r?` · <a class="ext" href="https://app.notion.com/${pid(r.url)}" target="_blank" rel="noopener">source row</a>`:""}</div>`;
}
const pc=p=>p>=80?"var(--green)":p>=50?"var(--yellow)":"var(--red)";
const prog=p=>p==null||p===""?'<span class="meta">no plan yet</span>':`<div class="prog"><i style="width:${Math.max(0,Math.min(100,+p))}%;background:${pc(+p)}"></i></div><span class="mono">${+p}%</span>`;
function render(){tabsUI();const A=S.data.agents||[],D=S.data.devices||[],P=S.data.projects||[],C=S.data.checkins||[],R=S.data.crons||[],T=S.data.tasks||[],X=S.data.coceo||[],V=S.data.caio||[],F=S.data.fat20||[];
 const Pm=byId(P),Am=byId(A),Dm=byId(D),Vm=byId(V);const coOK=p=>S.co==="All companies"||(p&&p.Company===S.co);const projOK=ids=>S.co==="All companies"||ids.some(i=>coOK(Pm[i]));const nm=(m,ids,f)=>ids.map(i=>m[i]?.[f]||"Unknown "+f+" ID "+i);
 const primaryIds=S.data.primary_agents||[],primarySet=new Set(primaryIds);const primary=primaryIds.map(id=>({a:Am[id]||{url:id,Agent:"Primary registration not included: "+id},L:live(id)}));const supplemental=A.filter(a=>!primarySet.has(pid(a.url))&&a.Status!=="⛔ Retired").map(a=>({a,L:live(pid(a.url))}));const LA=[...primary,...supplemental];const view=ReportStatus.snapshot(SNAP_AT);const evidenceAvailable=view.evidenceAvailable&&S.data.report_coverage?.exhaustive===true&&primary.length===6&&primary.every(x=>x.L.coverage?.included&&x.L.coverage?.exhaustive===true);const bl=LA.filter(x=>x.L.receiptRecent&&x.L.last?.Status==="BLOCKED");const WIN=ReportStatus.WINDOW_MIN;const allAvailable=view.evidenceAvailable&&S.data.report_coverage?.exhaustive===true;const B=ReportStatus.tally(LA.map(x=>x.L));const bv=k=>allAvailable?B[k]:"–";const N=S.data.counts||{};const bucketRow=`<h2>All registered agents (${B.total}, retired excluded)</h2><div class="kpis" id="buckets">${[["fresh","fresh report ≤"+WIN+"m","var(--green)"],["blocked","blocked, fresh report","var(--red)"],["clocked","clocked out <24h","var(--gray)"],["late","late >"+WIN+"m (incl. silent >24h)","var(--yellow)"],["never","never reported","var(--mute)"],["unverified","invalid or future report","var(--yellow)"],["unknown","unknown coverage","var(--gray)"]].map(([k,l,c])=>`<div class="kpi"><b style="color:${c}">${bv(k)}</b><span>${l}</span></div>`).join("")}</div><p class="sub">Buckets add up to ${B.total}. ${allAvailable?"":"Counts unavailable: snapshot stale or source coverage incomplete. "}Notion rows read this build: agents ${N.agents??"unknown"} · tasks ${N.tasks_total??"unknown"} (${N.tasks_open??"unknown"} open) · check-ins ${N.checkins??"unknown"} (${N.checkins_feed_rows??"unknown"} after collapsing repeats).</p>`;const wp=P.filter(p=>p["Progress %"]!=null&&coOK(p));const avg=wp.length?Math.round(wp.reduce((s,p)=>s+ +p["Progress %"],0)/wp.length):null;
 now.innerHTML=`<div class="kpis"><div class="kpi"><b style="color:var(--green)">${evidenceAvailable?primary.filter(x=>x.L.workerFresh).length:"–"}</b><span>validated worker reports ≤${WIN}m · ${primary.length} primary seats · as of snapshot</span></div><div class="kpi"><b>${evidenceAvailable?primary.filter(x=>x.L.receiptRecent).length:"–"}</b><span>recent server receipts ≤${WIN}m · as of snapshot · process unknown</span></div><div class="kpi"><b>${evidenceAvailable?primary.filter(x=>!x.L.last).length:"–"}</b><span>primary seats without known report · see coverage</span></div><div class="kpi"><b>${avg==null?"–":avg+"%"}</b><span>reported project progress · unverified</span></div></div>${bucketRow}<div class="warn">${evidenceAvailable?"Reports do not prove an agent process is running.":!view.evidenceAvailable?"Live status unavailable: this snapshot cannot substantiate current three-minute worker evidence.":"Live status unavailable: source coverage is incomplete."} Snapshot built ${esc(SNAP_AT)} · view read ${esc(new Date().toISOString())}. Notion is read on rebuild; open pages check for a newer published version every 60 seconds.</div>
 ${bl.length?`<h2>Reported blockers</h2><div class="grid">${bl.map(({a,L})=>`<div class="card r"><h3>${esc(a.Agent)}</h3><div class="doing">${esc(L.last["Blocker question"]||L.last["Doing now"]||"Blocked")}</div><div class="meta">${ago(L.last.Logged)}</div></div>`).join("")}</div>`:""}
 <h2>Latest activity</h2><p class="sub">${C.length} feed rows after collapsing ${S.data.report_coverage?.collapsed_repeats??0} repeated heartbeats · ${S.data.report_coverage?.unique_rows??"unknown"} unique source rows scanned · ${S.data.report_coverage?.unlinked_rows??"unknown"} unlinked reports. Agent status uses each seat’s latest report from the complete query.</p>${C.length?`<div class="wrap"><table><tr><th>Logged / Time</th><th>Agent</th><th>Reported status</th><th>Doing now</th><th>Project / Device</th><th>Proof</th></tr>${C.filter(c=>projOK(rel(c.Project))).slice(0,40).map(c=>`<tr><td class="mono">Logged: ${esc(c.Logged||"Unknown")} · ${esc(ago(c.Logged))}<br>Time: ${esc(c.Time||"Unknown")}</td><td>${esc(nm(Am,rel(c.Agent),"Agent").join(", ")||"Unknown agent relation")}</td><td>${esc(c.Status)}</td><td>${esc(c["Doing now"])}${c._repeats>1?`<div class="meta">×${+c._repeats} identical reports since ${esc(c._first_logged||"unknown")}</div>`:""}</td><td>${esc(nm(Pm,rel(c.Project),"Project").join(", ")||"Unknown project/task relation")}<br>${esc(nm(Dm,rel(c.Device),"Device").join(", ")||"Unknown device relation")}</td><td>${c.Proof?`<a class="ext" href="${esc(c.Proof)}" target="_blank" rel="noopener">proof</a>`:""}</td></tr>`).join("")}</table></div>`:`<div class="empty">No check-ins yet.</div>`}`;
 const vc=v=>v==="AGREE"?"var(--green)":v==="CHALLENGE"?"var(--yellow)":v==="WRONG"?"var(--red)":"var(--gray)";
 const card=(n,slot)=>{const e=X.find(x=>nm(Am,rel(x.Author),"Agent").some(a=>a.startsWith(n)));const logged=ReportStatus.time(e?.Logged),m=logged==null?null:(Date.now()-logged)/60000;const valid=view.available&&logged!=null&&logged<=view.built&&m>=0;return`<div class="card ${!valid?"":m<=13?"g":m<=25?"y":"r"}"><h3>${n}</h3><div class="meta">${slot} · ${!view.available?"Live status unavailable · ":e&&!valid?"Invalid server receipt · ":""}last ${e?ago(e.Logged):"not included in channel feed"}</div><div class="doing">${esc(e?e["Strategy note"]||"":"No check-in yet")}</div></div>`};
 coceo.innerHTML=`<h2>🤝 Co-CEOs</h2><div class="grid">${card("Dot",":00 :10 :20")}${card("Claude MB CLI",":05 :15 :25")}${card("Cursor CEO",":08 :18 :28")}</div><h2>Channel</h2>${X.length?`<div class="wrap"><table><tr><th>When</th><th>Who</th><th>Type</th><th>Strategy / message</th><th>Audit</th></tr>${X.map(x=>`<tr><td class="mono">${ago(x.Logged)}</td><td>${esc(nm(Am,rel(x.Author),"Agent").join(", ")||x.Entry)}</td><td>${esc(x.Type||"")}</td><td>${esc(x["Strategy note"]||"")}</td><td>${x["Audit verdict"]?`<b style="color:${vc(x["Audit verdict"])}">${esc(x["Audit verdict"])}</b> `:""}${esc(x["Audit of partner"]||"")}</td></tr>`).join("")}</table></div>`:`<div class="empty">No entries yet.</div>`}`;
 const agentCards=list=>list.filter(({a})=>projOK(rel(a.Projects))).map(({a,L})=>`<div class="card ${L.cls}"><h3><span class="dot" style="background:${L.color}"></span>${esc(a.Agent)}</h3><div class="meta">${esc(a.Platform||"Unknown platform")} · ${esc(L.label)}</div>${reportMeta(L)}<div class="doing">${esc(L.last?(L.last["Doing now"]||L.last.Status):a.Role||"No known linked report")}</div><div class="chips">${(nm(Dm,rel(L.last?L.last.Device:a.Device),"Device").length?nm(Dm,rel(L.last?L.last.Device:a.Device),"Device"):["Unknown device relation"]).map(d=>`<span class="chip">💻 ${esc(d)}</span>`).join("")}${(nm(Pm,rel(L.last?L.last.Project:a.Projects),"Project").length?nm(Pm,rel(L.last?L.last.Project:a.Projects),"Project"):["Unknown project/task relation"]).map(p=>`<span class="chip">🧭 ${esc(p)}</span>`).join("")}</div></div>`).join("");
 agents.innerHTML=`<h2>Primary worker seats (${primary.length})</h2><div class="grid">${agentCards(primary)}</div><h2>Additional registered agents (${supplemental.length})</h2><div class="grid">${agentCards(supplemental)}</div>`;
 devices.innerHTML=`<h2>Devices</h2><div class="grid">${D.map(d=>{const id=pid(d.url);const here=LA.filter(({a,L})=>rel(L.last?L.last.Device:a.Device).includes(id));const available=evidenceAvailable&&here.every(x=>x.L.coverage?.exhaustive);const on=available&&here.some(x=>x.L.receiptRecent);return`<div class="card ${on?"g":""}"><h3>${esc(d.Device)}</h3><div class="meta">${esc(d.Type||"")} · ${!available?"Live status unavailable · process unknown":on?"Recent report received · process unknown":"No recent validated receipt · process unknown"}</div><div class="chips">${here.map(({a,L})=>`<span class="chip"><span class="dot" style="background:${L.color}"></span>${esc(a.Agent)}</span>`).join("")||'<span class="meta">no agents</span>'}</div></div>`}).join("")}</div>`;
 const PP=P.filter(coOK);projects.innerHTML=`<h2>Projects</h2>${PP.length?`<div class="wrap"><table><tr><th>Project</th><th>Company</th><th>Now %</th><th>Last %</th><th>Δ</th><th>Finish condition</th></tr>${PP.map(p=>{const n=p["Progress %"],l=p["Last %"],d=(n!=null&&l!=null)?n-l:null;return`<tr><td><b>${esc(p.Project)}</b><div class="meta">${esc(p.Status||"")}</div></td><td>${esc(p.Company||"")}</td><td style="display:flex;gap:8px;align-items:center">${prog(n)}</td><td class="mono">${l??""}</td><td class="mono" style="color:${d==null?"var(--mute)":d>0?"var(--green)":d<0?"var(--red)":"var(--yellow)"}">${d==null?"":(d>0?"+":"")+d}</td><td>${esc(p["Finish condition"]||"")}</td></tr>`}).join("")}</table></div>`:`<div class="empty">No projects.</div>`}`;
 tasks.innerHTML=`<h2>All open tasks</h2><p class="sub">${T.length} open shown · ${S.data.counts?.tasks_total??"unknown"} rows read from Notion this build (${S.data.counts?.tasks_open??"unknown"} open).</p>${T.length?`<div class="wrap"><table><tr><th>Task</th><th>Owner</th><th>Status</th><th>%</th></tr>${T.map(t=>`<tr><td>${t.Focus==="__YES__"?"⭐ ":""}${esc(t.Name)}</td><td>${esc(t.Owner||"")}</td><td>${esc(t.Status||"")}</td><td class="mono">${t["Progress %"]??""}</td></tr>`).join("")}</table></div>`:`<div class="empty">No open tasks.</div>`}`;
 const G=P.filter(p=>p.Company==="Grokbot");const K=S.data.aiceo||[];const aiceoBlock=()=>{if(S.data.aiceo_coverage?.state==="unavailable"||!K.length)return`<p class="sub">${S.data.aiceo_coverage?.state==="empty"?"Exhaustive query returned no public rows.":"Coverage unavailable — zero rows must not be interpreted as an empty source."} ${esc(S.data.aiceo_status||"Not read this build.")}</p>`;const m={};K.forEach(k=>{const key=(k.Type||"Unknown type")+" · "+(k.Status||"no status");m[key]=(m[key]||0)+1});return`<p class="sub">${K.length} rows · latest dated ${esc(K.map(k=>k.Date||"").sort().pop()||"unknown")} · row titles are internal and not published.</p><div class="wrap"><table><tr><th>Type · Status</th><th>Rows</th></tr>${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<tr><td>${esc(k)}</td><td class="mono">${n}</td></tr>`).join("")}</table></div>`};
 caio.innerHTML=`<h2>🧠 Chief AI Officer</h2>${S.data.aiceo_coverage?.state==="unavailable"?`<div class="warn">AI CEO source coverage unavailable. ${esc(S.data.aiceo_status||"Read failed.")} Other command-center sources remain separate.</div>`:""}<p class="sub">Company divisions · reusable agent roles</p><div class="grid">${[...V].sort((a,b)=>(a.Order||0)-(b.Order||0)).map(v=>`<div class="card y"><h3>${esc(v.Division)}</h3><div class="meta">${esc(v.Status||"")}</div><div class="doing">${esc(v.Covers||"")}</div><div class="chips">${nm(Pm,rel(v.Projects),"Project").map(p=>`<span class="chip">🧭 ${esc(p)}</span>`).join("")}</div></div>`).join("")}</div>
 <details open><summary>💰 Grokbot commercialization · $5,000 per agent per month, prospect to close, autonomous</summary><p class="sub">${G.length} agent revenue lanes. Pricing: $5k setup per agent, $2k/mo first agent, $1k/mo each additional, UGC +$1k.</p></details>
 <details><summary>👑 AI CEO board · titles withheld</summary>${aiceoBlock()}</details>
 <details open><summary>🔥 FAT 20</summary>${F.length?`<div class="wrap"><table><tr><th>#</th><th>Item</th><th>Status</th><th>Progress</th></tr>${[...F].sort((a,b)=>(a.Rank||0)-(b.Rank||0)).map(f=>`<tr><td class="mono">${f.Rank??""}</td><td>${esc(f.Item)}</td><td>${esc(f.Status||"")}</td><td style="display:flex;gap:8px;align-items:center">${prog(f["Progress %"])}</td></tr>`).join("")}</table></div>`:`<div class="empty">FAT 20 empty.</div>`}</details>`;
 crons.innerHTML=`<h2>CRONs</h2>${R.length?`<div class="wrap"><table><tr><th>Routine</th><th>State</th><th>Cadence</th><th>Runs on</th><th>Defined in</th></tr>${R.map(r=>`<tr><td><b>${esc(r.Routine)}</b></td><td>${esc(r.State||"")}</td><td>${esc(r.Cadence||"")}</td><td>${esc(r["Runs on"]||"")}</td><td class="meta">${esc(r["Defined in"]||"")}</td></tr>`).join("")}</table></div>`:`<div class="empty">No routines.</div>`}`;}
const SNAP=__SNAP__;const SNAP_AT="__AT__";Object.assign(S.data,SNAP);
function snapshotAge(at){
 const time=Date.parse(at),age=(Date.now()-time)/60000;
 return Number.isFinite(time)&&age>=0?age:null;
}
const STALE_MIN=ReportStatus.SNAPSHOT_MAX_AGE_MS/60000;
function freshness(){
 const age=snapshotAge(SNAP_AT);
 const label=age==null?"INVALID TIMESTAMP":age>STALE_MIN?"STALE (>"+STALE_MIN+"m) · live status unavailable":"";
 fresh.textContent="Built "+(age==null?"at unknown age":ago(SNAP_AT))+" · "+SNAP_AT+(label?" · "+label:"");
 fresh.style.color=age==null||age>STALE_MIN?"var(--red)":"var(--mute)";
}
let refreshInFlight=false;
async function refreshSnapshot(){
 if(document.hidden||refreshInFlight)return;
 refreshInFlight=true;
 try{
  const response=await fetch("version.json?at="+Date.now(),{cache:"no-store"});
  if(!response.ok)return;
  const version=await response.json();
  const next=Date.parse(version.built_at),current=Date.parse(SNAP_AT);
  if(snapshotAge(version.built_at)==null||(snapshotAge(SNAP_AT)!=null&&next<=current))return;
  const url=new URL(location.href);
  // A newer manifest with cached old HTML gets one reload per version, not a loop.
  const queryStamp=url.searchParams.get("snapshot");
  if(snapshotAge(queryStamp)!=null&&Date.parse(queryStamp)>=next)return;
  const key="dashboard-refresh:"+url.pathname;
  try{
   const storedStamp=sessionStorage.getItem(key);
   if(snapshotAge(storedStamp)!=null&&Date.parse(storedStamp)>=next)return;
   sessionStorage.setItem(key,version.built_at);
  }catch{/* The URL guard still bounds reloads when browser storage is unavailable. */}
  url.searchParams.set("snapshot",version.built_at);
  url.searchParams.set("company",S.co);
  location.replace(url.href);
 }catch{/* Keep the current snapshot and its visible age when offline. */}
 finally{refreshInFlight=false}
}
function refreshView(){
 const expanded=Array.from(document.querySelectorAll("details"),d=>d.open);
 freshness();render();
 document.querySelectorAll("details").forEach((d,i)=>{if(i<expanded.length)d.open=expanded[i]});
 refreshSnapshot();
}
freshness();render();
setInterval(refreshView,60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshView()});

</script>
