<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>AI CEO · Bennett's Command Center (public)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1ec;--panel:#ffffff;--ink:#16181d;--mute:#6b6f78;--line:#dcd8cf;--green:#1f8a4c;--yellow:#b7860b;--red:#c2362b;--gray:#9aa0a8;--blue:#2d5bd7;--accent:#c2362b;--chip:#efece5;--sans:"IBM Plex Sans Condensed",-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1114;--panel:#171a1f;--ink:#e9e7e2;--mute:#8d929b;--line:#2a2e35;--chip:#21252b;--green:#3fbf74;--yellow:#e0b23a;--red:#ef5b4f;--gray:#6f757e;--blue:#6d93ff;--accent:#ef5b4f}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans)}
header{max-width:1180px;margin:0 auto;padding:22px 18px 8px}.kicker{font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1;margin:6px 0 4px}.sub{color:var(--mute);font-size:14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}.tabs{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.tabs a{flex:none;padding:12px 12px 10px;color:var(--mute);text-decoration:none;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}.tabs a.on{color:var(--ink);border-bottom-color:var(--accent)}
.bar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pill{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 12px;font:600 13px var(--sans);cursor:pointer}.pill.on{background:var(--ink);color:var(--bg)}
.fresh{margin-left:auto;font:12px var(--mono);color:var(--mute)}main{max-width:1180px;margin:0 auto;padding:4px 18px 40px}section{display:none}section.on{display:block}h2{font-size:22px;margin:18px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}.kpi b{display:block;font:600 30px/1 var(--mono)}.kpi span{color:var(--mute);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--gray);border-radius:10px;padding:12px 14px}.card.g{border-left-color:var(--green)}.card.y{border-left-color:var(--yellow)}.card.r{border-left-color:var(--red)}
.card h3{margin:0 0 2px;font-size:17px}.meta{font:12px var(--mono);color:var(--mute)}.doing{margin-top:6px;font-size:14px}.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.chip{background:var(--chip);border-radius:6px;padding:2px 7px;font-size:12px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{font:600 11px var(--mono);text-transform:uppercase;color:var(--mute)}
.prog{height:8px;background:var(--chip);border-radius:4px;min-width:90px;overflow:hidden}.prog i{display:block;height:100%}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.empty{color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:18px;text-align:center}.warn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
details{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}a.ext{color:var(--blue)}a.lk{color:inherit;text-decoration:none;border-bottom:1px dotted var(--mute)}a.chip{color:inherit;text-decoration:none}.mono{font-family:var(--mono)}
.st{display:inline-block;border-radius:999px;padding:2px 9px;font:600 12px var(--sans);color:#fff;white-space:nowrap}.st-done{background:var(--green)}.st-prog{background:var(--blue)}.st-need{background:var(--red)}.st-not{background:var(--gray)}.st-unp{background:var(--yellow);color:#16181d}.st-stuck{background:var(--red)}
.start{font-size:clamp(18px,4.4vw,22px);font-weight:700;margin:14px 0 6px}.counts{font:600 14px var(--mono);margin:2px 0}.counts .st{margin-left:2px}.needs{border-left:5px solid var(--red)}.needs ol{margin:6px 0 0;padding-left:20px}.needs li{margin-bottom:8px}.needs code{font:12px var(--mono);background:var(--chip);padding:1px 5px;border-radius:4px;word-break:break-all}
@media (max-width:640px){.stack table,.stack tbody,.stack tr,.stack td{display:block;width:100%}.stack tr:first-child{display:none}.stack tr{border-bottom:1px solid var(--line);padding:6px 0}.stack td{border:0;padding:3px 12px}.stack td[data-l]::before{content:attr(data-l) ": ";font:600 11px var(--mono);text-transform:uppercase;color:var(--mute)}.tabs a{padding:12px 9px 10px}}
</style>
</head>
<body>
<header><div class="kicker">AI CEO</div><h1>Bennett's command center</h1><div class="sub">Snapshots from Notion · rebuilt about every 5 minutes. Completion requires verified output.</div></header>
<nav><div class="tabs" id="tabs"></div></nav>
<div class="bar"><div id="companies" style="display:flex;gap:6px;flex-wrap:wrap"></div><span class="fresh" id="fresh"></span></div>
<main><div id="pagewarn"></div><section id="asks"></section><section id="now"></section><section id="coceo"></section><section id="agents"></section><section id="devices"></section><section id="projects"></section><section id="tasks"></section><section id="caio"></section><section id="crons"></section><section id="detail"></section></main>
<script>
__REPORT_STATUS__
const TABS=[["asks","Your asks"],["now","Now"],["coceo","Co-CEOs"],["agents","Agents"],["devices","Devices"],["projects","Projects"],["tasks","All tasks"],["caio","CAIO"],["crons","CRONs"]];
const COMPANIES=["All companies","Franchise KI","Advaita AI","Grokbot","Personal"];
const S={data:{},tab:"asks",co:"All companies"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pid=u=>{const m=String(u||"").replace(/-/g,"").match(/[0-9a-f]{32}/i);return m?m[0].toLowerCase():""};
const rel=v=>{if(!v)return[];try{const a=typeof v==="string"?JSON.parse(v):v;return(Array.isArray(a)?a:[a]).map(pid).filter(Boolean)}catch{return[]}};
const ago=t=>{if(!t)return"unknown";const parsed=ReportStatus.time(t);if(parsed==null||parsed>Date.now())return"invalid/future timestamp";const m=Math.floor((Date.now()-parsed)/60000);return m<1?"just now":m<60?m+"m ago":m<1440?Math.floor(m/60)+"h ago":Math.floor(m/1440)+"d ago"};
const byId=l=>{const m={};(l||[]).forEach(r=>m[pid(r.url)]=r);return m};
// Check-ins Status variants PICKED_UP, PICKED-UP, PICKED and PICKEDUP display and count as "PICKED UP"; Notion options are unchanged.
const stat=s=>{const u=String(s??"").trim();return /^PICKED(?:[\s_-]*UP)?$/i.test(u)?"PICKED UP":u};
const statusCounts=c=>{const m={};Object.entries(c||{}).forEach(([k,v])=>{const key=stat(k)||"No status";m[key]=(m[key]||0)+(+v||0)});return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))};
function tabsUI(){tabs.innerHTML=TABS.map(([k,l])=>`<a href="#${k}" data-k="${k}" class="${S.tab===k?"on":""}">${l}</a>`).join("");companies.innerHTML=COMPANIES.map(c=>`<button class="pill ${S.co===c?"on":""}" data-co="${esc(c)}">${esc(c)}</button>`).join("");document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===S.tab))}
tabs.addEventListener("click",e=>{const a=e.target.closest("a");if(!a)return;e.preventDefault();S.tab=a.dataset.k;history.replaceState(null,"","#"+S.tab);render()});
companies.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.co=b.dataset.co;render()});
const savedCompany=new URL(location.href).searchParams.get("company");if(COMPANIES.includes(savedCompany))S.co=savedCompany;
function route(){const h=location.hash.slice(1),m=h.match(/^(agent|project)=([0-9a-f]{32})$/i);if(m){S.tab="detail";S.det=[m[1].toLowerCase(),m[2].toLowerCase()]}else if(TABS.some(t=>t[0]===h)){S.tab=h;S.det=null}}route();
if(typeof addEventListener==="function")addEventListener("hashchange",()=>{route();render();if(typeof scrollTo==="function")scrollTo(0,0)});
function live(id){return ReportStatus.evaluate(S.data.report_coverage?.per_agent?.[id],SNAP_AT)}
function reportMeta(L){
 const r=L.last,stamp=(t)=>esc(t||"Unknown");
 return `<div class="meta">Process: ${esc(L.process)}</div><div class="meta">Logged (server): ${stamp(r?.Logged)}${r?.Logged?" · "+esc(ago(r.Logged)):""} · ${esc(L.receipt)}</div><div class="meta">Time (worker): ${stamp(r?.Time)} · ${esc(L.worker)}</div><div class="meta">Coverage: ${L.coverage?.exhaustive?"exhaustive source query":"not included / unverified"} · ${L.coverage?.matching_rows??"unknown"} matching rows · ${L.coverage?.invalid_receipt_rows||0} quarantined invalid receipts${L.coverage?.latest_invalid_receipt?" · latest invalid Logged: "+stamp(L.coverage.latest_invalid_receipt.Logged):""}${r?` · <a class="ext" href="https://app.notion.com/${pid(r.url)}" target="_blank" rel="noopener">source row</a>`:""}</div>`;
}
const lk=(kind,m,ids,f,cls)=>ids.map(i=>`<a class="${cls||"chip"}" href="#${kind}=${i}">${esc(m[i]?.[f]||"Unknown "+f+" ID "+i)}</a>`);
// A project is active unless closed, and only while a check-in or Notion edit falls within 7 days of this snapshot.
const CUR_MS=6*36e5,WEEK_MS=7*864e5,lastAct=p=>Math.max(-Infinity,...[p?._edited,S.data.project_checkins?.[pid(p?.url)]?.latest_logged].map(t=>Date.parse(t||"")).filter(Number.isFinite));
const closedP=p=>/done|archiv|park|retired|cancel/i.test(String(p?.Status||""));
// Without a published edit time the age is unmeasurable, so the project stays visible rather than being called idle.
const activeP=p=>!!p&&!closedP(p)&&(p._edited==null||(Number.isFinite(Date.parse(SNAP_AT))&&Date.parse(SNAP_AT)-lastAct(p)<=WEEK_MS));
const blockedP=p=>/stuck|block/i.test(String(p?.Status||""));
const retiredA=a=>/retired|inactive/i.test(String(a?.Status||""));
const lastActLabel=p=>lastAct(p)===-Infinity?"no check-in or edit on record":"last activity "+ago(new Date(lastAct(p)).toISOString());
const pc=p=>p>=80?"var(--green)":p>=50?"var(--yellow)":"var(--red)";
const prog=p=>p==null||p===""?'<span class="meta">no plan yet</span>':`<div class="prog"><i style="width:${Math.max(0,Math.min(100,+p))}%;background:${pc(+p)}"></i></div><span class="mono">${+p}%</span>`;
// "Your asks": Bennett's asks, every lane with its owner, and the few things only he can do (data: asks.json).
const ST={"Done":"st-done","In progress":"st-prog","Needs you":"st-need","Not started":"st-not","Unproved":"st-unp","Stuck":"st-stuck"};
const stPill=s=>`<span class="st ${ST[s]||"st-not"}">${esc(s||"Not started")}</span>`;
const laneStatus=s=>{const t=String(s||"");return /done|complete|shipped/i.test(t)?"Done":/stuck|block/i.test(t)?"Stuck":/not started|waiting|todo/i.test(t)?"Not started":/moving|progress|on track|active/i.test(t)?"In progress":t?t.replace(/^[^A-Za-z]+/,""):""};
const proofLink=pr=>{const t=esc(pr?.text||"");return /^https:\/\//.test(pr?.url||"")?`<a class="ext" href="${esc(pr.url)}" target="_blank" rel="noopener">${t||"link"}</a>`:t||'<span class="meta">none</span>'};
function renderAsks(P){
 const el=typeof asks!=="undefined"?asks:null;if(!el)return;const K=S.data.asks||{},Q=K.asks||[],L=K.lanes||[],NY=K.needs_you||[];
 const c=k=>Q.filter(a=>a.status===k).length;
 const laneP=id=>P.find(p=>String(p.Project||"").toUpperCase().startsWith(String(id).toUpperCase()+" ·"));
 const rows=Q.map(a=>`<tr><td class="mono" data-l="#">${+a.n||""}</td><td data-l="Your ask"><b>${esc(a.ask)}</b></td><td data-l="Owner">${esc(a.owner)}</td><td data-l="Lane">${esc(a.lane)}</td><td data-l="Status">${stPill(a.status)}</td><td data-l="Proof">${proofLink(a.proof)}</td><td class="mono" data-l="Last update">${esc(a.updated)}</td></tr>`).join("");
 const lanes=L.map(l=>{const p=laneP(l.lane),st=p?laneStatus(p.Status)||l.status:l.status,rep=p?lastActLabel(p):l.report;return`<tr><td data-l="Lane"><b>${p?`<a class="lk" href="#project=${pid(p.url)}">${esc(l.lane)}</a>`:esc(l.lane)}</b></td><td data-l="Owner">${esc(l.owner)}</td><td data-l="What it does">${esc(l.does)}</td><td data-l="Status">${stPill(st)}</td><td data-l="Last report">${esc(rep)}${p?"":' <span class="meta">(not on the board yet)</span>'}</td></tr>`}).join("");
 el.innerHTML=`<p class="start">Start here: everything you asked for, who owns it, and whether it's done.</p>
<p class="counts" id="ask-counts">${Q.length} asks · ${stPill("Done")} ${c("Done")} · ${stPill("In progress")} ${c("In progress")} · ${stPill("Needs you")} ${c("Needs you")}</p><p class="counts">${stPill("Unproved")} ${c("Unproved")} · ${stPill("Not started")} ${c("Not started")}</p>
<p class="sub">List updated ${esc(K.updated||"unknown")} · Done only with proof · <a class="lk" href="#asks" onclick="document.getElementById('needs-you').scrollIntoView();return false">Jump to what needs you (${NY.length})</a></p>
<h2>A. Everything you asked for (${Q.length})</h2>${Q.length?`<div class="wrap stack"><table><tr><th>#</th><th>Your ask</th><th>Owner</th><th>Lane</th><th>Status</th><th>Proof</th><th>Last update</th></tr>${rows}</table></div>`:'<div class="empty">No asks recorded yet.</div>'}
<h2>B. Every lane and who owns it (${L.length})</h2>${L.length?`<div class="wrap stack"><table><tr><th>Lane</th><th>Owner</th><th>What it does</th><th>Status</th><th>Last report</th></tr>${lanes}</table></div>`:'<div class="empty">No lanes recorded yet.</div>'}
<h2 id="needs-you">C. Needs you (${NY.length})</h2>${NY.length?`<div class="warn needs"><ol>${NY.slice(0,5).map(n=>`<li><b>${esc(n.what)}</b><br>Where: ${esc(n.where)}<br>Do: <code>${esc(n.do)}</code><br>Done when: ${esc(n.done_when)}</li>`).join("")}</ol></div>`:'<div class="empty">Nothing needs you right now.</div>'}
${K.sources?`<p class="sub">Sources: ${esc(K.sources)}</p>`:""}`;
}
function render(){tabsUI();renderAsks(S.data.projects||[]);const A=S.data.agents||[],D=S.data.devices||[],P=S.data.projects||[],C=S.data.checkins||[],R=S.data.crons||[],T=S.data.tasks||[],X=S.data.coceo||[],V=S.data.caio||[],F=S.data.fat20||[];
 const Pm=byId(P),Am=byId(A),Dm=byId(D),Vm=byId(V);const coOK=p=>S.co==="All companies"||(p&&p.Company===S.co);const projOK=ids=>S.co==="All companies"||ids.some(i=>coOK(Pm[i]));const nm=(m,ids,f)=>ids.map(i=>m[i]?.[f]||"Unknown "+f+" ID "+i);
 const projAgents=p=>{const id=pid(p.url);return[...new Set(rel(p.Agents).concat(A.filter(a=>rel(a.Projects).includes(id)).map(a=>pid(a.url))))]};
 const primaryIds=S.data.primary_agents||[],primarySet=new Set(primaryIds);const primary=primaryIds.map(id=>({a:Am[id]||{url:id,Agent:"Primary registration not included: "+id},L:live(id)}));const supplemental=A.filter(a=>!primarySet.has(pid(a.url))&&!retiredA(a)).map(a=>({a,L:live(pid(a.url))}));const LA=[...primary,...supplemental];const view=ReportStatus.snapshot(SNAP_AT);const evidenceAvailable=view.evidenceAvailable&&S.data.report_coverage?.exhaustive===true&&primary.length>0&&primary.every(x=>x.L.coverage?.included&&x.L.coverage?.exhaustive===true);const bl=LA.filter(x=>x.L.receiptRecent&&x.L.last?.Status==="BLOCKED");const WIN=ReportStatus.WINDOW_MIN;const allAvailable=view.evidenceAvailable&&S.data.report_coverage?.exhaustive===true;const B=ReportStatus.tally(LA.map(x=>x.L));const bv=k=>allAvailable?B[k]:"–";const N=S.data.counts||{};const bucketRow=`<h2>All registered agents (${B.total}, retired excluded)</h2><div class="kpis" id="buckets">${[["fresh","fresh report ≤"+WIN+"m","var(--green)"],["blocked","blocked, fresh report","var(--red)"],["clocked","clocked out <24h","var(--gray)"],["late","late >"+WIN+"m (incl. silent >24h)","var(--yellow)"],["never","never reported","var(--mute)"],["unverified","invalid or future report","var(--yellow)"],["unknown","unknown coverage","var(--gray)"]].map(([k,l,c],i)=>(i===4?'</div><div class="kpis">':"")+`<div class="kpi"><b style="color:${c}">${bv(k)}</b><span>${l}</span></div>`).join("")}</div><p class="sub">Buckets add up to ${B.total}. ${allAvailable?"":"Counts unavailable: snapshot stale or source coverage incomplete. "}Notion rows read this build: agents ${N.agents??"unknown"} · tasks ${N.tasks_total??"unknown"} (${N.tasks_open??"unknown"} open) · check-ins ${N.checkins??"unknown"} (${N.checkins_feed_rows??"unknown"} after collapsing repeats).</p><p class="sub" id="status-counts">Reported status across scanned check-ins: ${N.checkin_status?statusCounts(N.checkin_status).map(([k,v])=>esc(k)+" "+v).join(" · "):"unknown"}.</p>`;const wp=P.filter(p=>p["Progress %"]!=null&&coOK(p));const avg=wp.length?Math.round(wp.reduce((s,p)=>s+ +p["Progress %"],0)/wp.length):null;
 now.innerHTML=`<div class="kpis"><div class="kpi"><b style="color:var(--green)">${evidenceAvailable?primary.filter(x=>x.L.workerFresh).length:"–"}</b><span>validated worker reports ≤${WIN}m · ${primary.length} primary seats · as of snapshot</span></div><div class="kpi"><b>${evidenceAvailable?primary.filter(x=>x.L.receiptRecent).length:"–"}</b><span>recent server receipts ≤${WIN}m · as of snapshot · process unknown</span></div><div class="kpi"><b>${evidenceAvailable?primary.filter(x=>!x.L.last).length:"–"}</b><span>primary seats without known report · see coverage</span></div><div class="kpi"><b>${avg==null?"–":avg+"%"}</b><span>reported project progress · unverified</span></div></div>${bucketRow}<div class="warn">${evidenceAvailable?"Reports do not prove an agent process is running.":!view.evidenceAvailable?"Live status unavailable: this snapshot is older than "+ReportStatus.EVIDENCE_MAX_AGE_MS/60000+" minutes and cannot substantiate current "+WIN+"-minute worker evidence.":"Live status unavailable: source coverage is incomplete."} Snapshot built ${esc(SNAP_AT)} · view read ${esc(new Date().toISOString())}. Notion is read on rebuild; open pages check for a newer published version every 60 seconds.</div>
 ${bl.length?`<h2>Reported blockers</h2><div class="grid">${bl.map(({a,L})=>`<div class="card r"><h3><a class="lk" href="#agent=${pid(a.url)}">${esc(a.Agent)}</a></h3><div class="doing">${esc(L.last["Blocker question"]||L.last["Doing now"]||"Blocked")}</div><div class="meta">${ago(L.last.Logged)}</div></div>`).join("")}</div>`:""}
 ${(()=>{const bq=LA.filter(x=>!retiredA(x.a)&&!bl.includes(x)&&x.L.last&&String(x.L.last["Blocker question"]||"").trim()&&projOK(rel(x.L.last.Project)));const bpAll=P.filter(p=>coOK(p)&&blockedP(p)&&!closedP(p));const fresh6=t=>Number.isFinite(t)&&Number.isFinite(Date.parse(SNAP_AT))&&Date.parse(SNAP_AT)-t<=CUR_MS;const bqAll=bq;const bqOld=bqAll.filter(x=>!fresh6(Date.parse(x.L.last.Logged||"")));const bpOld=bpAll.filter(p=>!fresh6(lastAct(p)));const bqNow=bqAll.filter(x=>!bqOld.includes(x)),bp=bpAll.filter(p=>!bpOld.includes(p));const oldN=bqOld.length+bpOld.length;const olderBlk=oldN?`<details><summary>Older blockers, no activity for more than 6 h (${oldN})</summary><div class="chips">${bqOld.map(({a})=>`<a class="chip" href="#agent=${pid(a.url)}">❓ ${esc(a.Agent)}</a>`).join("")}${bpOld.map(p=>`<a class="chip" href="#project=${pid(p.url)}">${esc(p.Project)} · ${esc(lastActLabel(p))}</a>`).join("")}</div></details>`:"";return (bqNow.length||bp.length?`<h2>Open blocker questions · blocked projects (${bqNow.length+bp.length})</h2><p class="sub">Only blocks with activity in the last 6 h. Older ones are folded below.</p><div class="grid">${bqNow.map(({a,L})=>`<div class="card y"><h3><a class="lk" href="#agent=${pid(a.url)}">${esc(a.Agent)}</a></h3><div class="doing">❓ ${esc(L.last["Blocker question"])}</div><div class="meta">latest check-in ${esc(ago(L.last.Logged))} · ${esc(stat(L.last.Status))}</div><div class="chips">${lk("project",Pm,rel(L.last.Project),"Project").join("")}</div></div>`).join("")}${bp.map(p=>`<div class="card r"><h3><a class="lk" href="#project=${pid(p.url)}">${esc(p.Project)}</a></h3><div class="meta">${esc(p.Status||"")} · ${esc(lastActLabel(p))}</div><div class="chips">${lk("agent",Am,projAgents(p),"Agent").join("")||'<span class="meta">no agents linked</span>'}</div></div>`).join("")}</div>`:(oldN?'<h2>Open blocker questions · blocked projects (0)</h2><p class="sub">No block has had activity in the last 6 h.</p>':""))+olderBlk})()}

function snapshotAge(at){

const STALE_MIN=ReportStatus.SNAPSHOT_MAX_AGE_MS/60000;

}
let refreshInFlight=false;
async function refreshSnapshot(){
 if(document.hidden||refreshInFlight)return;
 refreshInFlight=true;
 try{
  const response=await fetch("version.json?at="+Date.now(),{cache:"no-store"});
  if(!response.ok)return;
  const version=await response.json();
  const next=Date.parse(version.built_at),current=Date.parse(SNAP_AT);
  if(snapshotAge(version.built_at)==null||(snapshotAge(SNAP_AT)!=null&&next<=current))return;
  const url=new URL(location.href);
  // A newer manifest with cached old HTML gets one reload per version, not a loop.
  const queryStamp=url.searchParams.get("snapshot");
  if(snapshotAge(queryStamp)!=null&&Date.parse(queryStamp)>=next)return;
  const key="dashboard-refresh:"+url.pathname;
  try{
   const storedStamp=sessionStorage.getItem(key);
   if(snapshotAge(storedStamp)!=null&&Date.parse(storedStamp)>=next)return;
   sessionStorage.setItem(key,version.built_at);
  }catch{/* The URL guard still bounds reloads when browser storage is unavailable. */}
  url.searchParams.set("snapshot",version.built_at);
  url.searchParams.set("company",S.co);
  location.replace(url.href);
 }catch{/* Keep the current snapshot and its visible age when offline. */}

}
