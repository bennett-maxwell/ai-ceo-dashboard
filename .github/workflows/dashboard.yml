name: Rebuild AI CEO dashboard
on:
  push:
    branches: [main]
  schedule: [{cron: "3,13,23,33,43,53 * * * *"}]
  workflow_dispatch: {}
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: {name: github-pages}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
      - run: node --test tests/*.cjs
      - run: python3 tests/self_check.py
      - run: python3 build.py
        # SCRUB_TERMS is a repo secret (one term per line); it is never committed and Actions masks it in logs.
        env: {NOTION_TOKEN: "${{ secrets.NOTION_TOKEN }}", SCRUB_TERMS: "${{ secrets.SCRUB_TERMS }}"}
      - uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - uses: actions/deploy-pages@v4
