name: Dashboard heartbeat
# Cloud dispatcher: asks dashboard.yml for a rebuild about every 4-5 minutes (sleep 240), then starts the next heartbeat.
# GitHub's own cron is best-effort (observed hours apart), so it only reseeds the chain if it ever breaks.
# Only one heartbeat runs at a time: the concurrency group keeps at most one waiting run, so chains never multiply.
# Stop it any time with: gh workflow disable heartbeat.yml -R bennett-maxwell/ai-ceo-dashboard
# No run deadline: the 2026-10-07T00:00:00Z shutoff was removed 2026-10-06 per Bennett 10/5 19:29 ("improve them all
# permanently and run them") and FLEET SHIP ORDER item 1 (cut the wait from 9 to 4 minutes and remove the shutoff).
# Cost basis: the repo is public, so GitHub-hosted Actions minutes are $0. The end condition is the disable command above.
# It uses only the built-in workflow token.
on:
  workflow_dispatch: {}
  schedule: [{cron: "3,13,23,33,43,53 * * * *"}]
permissions: {actions: write, contents: read}
concurrency: {group: heartbeat, cancel-in-progress: false}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Rebuild the dashboard
        run: gh workflow run dashboard.yml --ref main
      # The wait and the next heartbeat still happen if the rebuild request fails, so one bad call never ends the
      # chain and never makes it spin fast. Cancelling this run by hand ends the chain.
      - name: Wait about four minutes
        if: ${{ !cancelled() }}
        run: sleep 240
      - name: Start the next heartbeat
        if: ${{ !cancelled() }}
        run: gh workflow run heartbeat.yml --ref main
